version: '3.9'

services:
  app:
    image: thecodingmachine/php:8.2-v4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      APACHE_DOCUMENT_ROOT: public/
      PHP_EXTENSION_XDEBUG: 1
      PHP_INI_MEMORY_LIMIT: 1G
      DATABASE_URL: mysql://app:app@db:3306/open_event_manager?serverVersion=8.0&charset=utf8mb4
      APP_ENV: dev
      APP_DEBUG: 1
    volumes:
      - .:/var/www/html:rw
      - composer_cache:/tmp/composer
    command: >

          composer install --working-dir=/var/www/html --no-interaction --prefer-dist


  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: open_event_manager
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  composer_cache:
